<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spanish with Miriam</title><meta name="theme-color" content="#B3121C">
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--rojo:#B3121C;--rojo-osc:#8E0E16;--oro:#E9A81B;--oro-claro:#FBE6B0;--crema:#FFF9EF;--tinta:#2B1A14;--suave:#7A6458;--linea:#F0E2CC;--sombra:0 6px 18px rgba(120,60,20,.10)}
*{box-sizing:border-box}
body{margin:0;background:var(--crema);color:var(--tinta);font-family:Nunito,system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 30px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.15}
.top{position:sticky;top:0;z-index:5;background:rgba(255,249,239,.95);border-bottom:1px solid var(--linea)}
.top .wrap{display:flex;align-items:center;gap:10px;height:62px;padding-bottom:0}
.top img{height:54px}
.top a{margin-left:auto;color:var(--rojo);font-weight:800;text-decoration:none}
.hero{padding:18px 0 6px}
.hero h1{color:var(--rojo);font-size:2rem}
.hero p{color:var(--suave);margin:4px 0 0}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
button{font:inherit;cursor:pointer}
.chip{border:2px solid var(--rojo);background:#fff;color:var(--rojo);border-radius:20px;padding:6px 14px;font-weight:800}
.chip.on{background:var(--rojo);color:#fff}
.panels.one{max-width:520px;margin:0 auto;display:block}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.panel{background:#fff;border:2px solid var(--oro);border-radius:18px;padding:10px;text-align:center;box-shadow:var(--sombra)}
.panel.no{border-color:#c9c0b8}
.panel h2{font-size:1.3rem;color:var(--rojo)}
.panel.no h2{color:#8a8078}
.panel .ex{color:#9a6c0c;font-weight:800}
.panel .d{font-size:.92rem;color:#4b3a32;min-height:44px}
.panel svg{width:100%;height:auto;background:var(--oro-claro);border-radius:12px;margin:6px 0}
.lbl{font-size:8px;fill:#8a6a10;font-family:Nunito;font-weight:700}
.card{background:#fff;border-radius:18px;box-shadow:var(--sombra);padding:14px 16px;margin:14px 0}
.card h3{color:var(--rojo);font-size:1.2rem;margin-bottom:8px}
.miriam{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.words{display:flex;flex-wrap:wrap;gap:8px}
.w{display:flex;align-items:center;gap:8px;background:var(--crema);border:2px solid var(--linea);border-radius:14px;padding:6px 10px}
.w b{font-size:1.1rem}
.w span{color:var(--suave);font-size:.85rem;font-style:italic}
.play{border:0;background:var(--rojo);color:#fff;width:34px;height:34px;border-radius:50%;font-size:14px;box-shadow:0 3px 0 var(--rojo-osc)}
.play.off{background:#d8cfc6;box-shadow:none;cursor:default}
.box{border-radius:14px;padding:10px 14px;margin:12px 0}
.rec{background:var(--oro-claro);border-left:6px solid var(--oro)}
.ojo{background:#FDE3E3;border-left:6px solid var(--rojo)}
.tt{color:var(--rojo);font-weight:800}
.en{color:var(--suave);font-style:italic}
table{border-collapse:collapse;width:100%}
th{background:var(--rojo);color:#fff;padding:6px 8px;text-align:left}
td{padding:6px 8px;border-bottom:1px solid var(--linea)}
tr:nth-child(even) td{background:#FFF3D6}
.recbtn{background:var(--rojo);color:#fff;border:0;border-radius:14px;padding:10px 16px;font-weight:800;box-shadow:0 3px 0 var(--rojo-osc)}
.recbtn.live{background:#2E8B57;box-shadow:0 3px 0 #1d6b40}
.note{font-size:.85rem;color:var(--suave)}
.vbtn{font-family:Fraunces,serif;font-size:1.6rem;width:54px;height:54px;border-radius:14px;border:2px solid var(--rojo);background:#fff;color:var(--rojo);font-weight:700}
.vbtn.on{background:var(--rojo);color:#fff}
footer{text-align:center;color:var(--rojo);font-size:.8rem;margin-top:20px}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.hub a{display:block;background:#fff;border:2px solid var(--oro);border-radius:18px;padding:18px;text-decoration:none;color:var(--tinta);box-shadow:var(--sombra)}
.hub a b{font-family:Fraunces,serif;font-size:2rem;color:var(--rojo);display:block}

.palabras{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.palabra{background:#fff;border-radius:22px;box-shadow:var(--sombra);padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;border:2px solid transparent;transition:border-color .2s}
.palabra.practicada{border-color:#CDE8D6}
.palabra .emoji{font-size:4rem;line-height:1;margin:6px 0 8px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.08))}
.palabra .emoji svg{width:64px;height:64px}
.palabra .es{font-family:Fraunces,serif;font-size:1.6rem;font-weight:700;color:var(--tinta);padding:4px 10px;border-radius:12px;border:0;border-bottom:2px dashed var(--oro);background:none;cursor:pointer}
.palabra .es b{color:var(--rojo)}
.palabra .trad{min-height:1.5em;margin-top:6px;font-weight:700;color:var(--suave);font-size:.98rem}
.palabra .trad.vista{color:#1F5E8C}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:12px}
.acc{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 8px;border-radius:14px;font-weight:800;font-size:.92rem;background:var(--crema);border:1.5px solid var(--linea);color:var(--tinta)}
.acc:disabled{opacity:.4;cursor:default}
.acc.escuchar{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.acc.grabar.activo{background:#fff0f0;border-color:var(--rojo);color:var(--rojo);animation:pulso 1s infinite}
@keyframes pulso{50%{box-shadow:0 0 0 6px rgba(179,18,28,.12)}}
.acc.comparar{grid-column:1/-1;background:var(--oro-claro);border-color:var(--oro)}
.acc svg{width:18px;height:18px;flex:none}
.aviso{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:.92rem;transition:transform .3s;z-index:20;max-width:90vw;text-align:center}
.aviso.ver{transform:translateX(-50%) translateY(0)}
.quien{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.quien input{font:inherit;padding:10px 12px;border:2px solid var(--linea);border-radius:12px;background:var(--crema)}
.barra{height:8px;background:var(--linea);border-radius:99px;margin-top:6px;overflow:hidden;min-width:90px}
.barra i{display:block;height:100%;background:var(--oro);border-radius:99px}
.progreso-txt{font-size:.78rem;color:var(--suave);font-weight:700;margin-top:2px}

.ov{width:100%;border-collapse:separate;border-spacing:0 8px}
.ov td{background:#fff;border:0;vertical-align:middle;padding:10px}
.ov tr td:first-child{border-radius:14px 0 0 14px;font-family:Fraunces,serif;font-size:1.7rem;color:var(--rojo);font-weight:700;white-space:nowrap;text-align:center}
.ov tr td:last-child{border-radius:0 14px 14px 0}
.ov .how b{display:block}.ov .how span{color:var(--suave);font-size:.9rem}
.ex4{display:flex;flex-wrap:wrap;gap:6px}
.ex4 .w{padding:3px 8px}.ex4 .play{width:28px;height:28px;font-size:11px}
.go{display:inline-block;background:var(--rojo);color:#fff;text-decoration:none;font-weight:800;border-radius:14px;padding:8px 12px;white-space:nowrap;box-shadow:0 3px 0 var(--rojo-osc)}
.theme{display:inline-block;background:var(--oro-claro);color:#7a5200;border-radius:12px;padding:4px 10px;font-weight:800;margin-top:6px}
.grid8{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.w8{background:#fff;border:2px solid var(--linea);border-radius:16px;padding:10px;display:flex;align-items:center;gap:10px}
.w8 .e{font-size:2rem}.w8 b{font-size:1.15rem;display:block}.w8 span{color:var(--suave);font-style:italic;font-size:.9rem}
.how2{background:#fff;border-radius:18px;box-shadow:var(--sombra);padding:14px 16px;margin:14px 0}
.how2 h3{color:var(--rojo);margin-bottom:6px}
.nav{display:flex;justify-content:space-between;margin-top:16px}.nav a{color:var(--rojo);font-weight:800;text-decoration:none}
@media(max-width:640px){.ov tr{display:block;background:#fff;border-radius:14px;margin-bottom:8px}.ov td{display:block;border-radius:0!important}.ov tr td:first-child{text-align:left}}
</style></head><body>
