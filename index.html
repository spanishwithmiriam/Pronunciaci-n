<style>
:root{
  --rojo:#B3121C; --rojo-osc:#8E0E16; --oro:#E9A81B; --oro-claro:#FBE6B0;
  --crema:#FFF9EF; --papel:#FFFFFF; --tinta:#2B1A14; --suave:#7A6458;
  --linea:#F0E2CC; --ok:#2E8B57; --sombra:0 6px 18px rgba(120,60,20,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--crema);color:var(--tinta);font-family:Nunito,system-ui,sans-serif}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.15}
.oculto{display:none!important}

/* Barra superior */
.top{position:sticky;top:0;z-index:5;background:rgba(255,249,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--linea)}
.top .wrap{display:flex;align-items:center;gap:10px;height:62px}
.top img{height:44px;width:auto}
.top .nombre{margin-left:auto;font-weight:700;color:var(--suave);font-size:.95rem;display:flex;align-items:center;gap:6px}
.top .nombre button{color:var(--rojo);font-weight:800;font-size:.85rem;text-decoration:underline}
.volver{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--rojo);padding:8px 4px}

/* Bienvenida */
#bienvenida{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.tarjeta-bienvenida{background:var(--papel);border-radius:28px;box-shadow:var(--sombra);padding:32px 24px;max-width:420px;width:100%;text-align:center}
.tarjeta-bienvenida img{width:min(280px,80%);height:auto;margin:0 auto 12px;display:block}
.tarjeta-bienvenida h1{font-size:1.6rem;color:var(--rojo);margin-bottom:6px}
.tarjeta-bienvenida p{color:var(--suave);margin:0 0 20px}
input[type=text]{width:100%;font:inherit;font-size:1.1rem;padding:14px 16px;border:2px solid var(--linea);border-radius:16px;background:var(--crema);outline:none;text-align:center}
input[type=text]:focus{border-color:var(--oro)}
.btn-principal{margin-top:14px;width:100%;background:var(--rojo);color:#fff;font-weight:800;font-size:1.1rem;padding:15px;border-radius:16px;box-shadow:0 4px 0 var(--rojo-osc)}
.btn-principal:active{transform:translateY(2px);box-shadow:0 2px 0 var(--rojo-osc)}

/* Inicio */
.saludo{padding:24px 0 8px}
.saludo h2{font-size:1.7rem}
.saludo p{color:var(--suave);margin:6px 0 0}
.secciones{display:grid;gap:14px;padding:16px 0 32px}
.sec-card{display:flex;align-items:center;gap:16px;text-align:left;background:var(--papel);border-radius:22px;padding:18px;box-shadow:var(--sombra);border:2px solid transparent;transition:transform .15s,border-color .15s}
.sec-card:hover{border-color:var(--oro-claro)}
.sec-card:active{transform:scale(.98)}
.sec-letra{flex:none;width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--rojo),#D2362B);color:#fff;font-family:Fraunces,serif;font-size:1.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:.5px}
.sec-card:nth-child(2) .sec-letra{background:linear-gradient(135deg,#D98A0B,var(--oro))}
.sec-card:nth-child(3) .sec-letra{background:linear-gradient(135deg,#8E0E16,#C0392B)}
.sec-card h3{font-size:1.2rem}
.sec-card .ej{color:var(--suave);font-size:.92rem;margin-top:2px}
.barra{height:8px;background:var(--linea);border-radius:99px;margin-top:10px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--oro);border-radius:99px;transition:width .4s}
.progreso-txt{font-size:.8rem;color:var(--suave);margin-top:4px;font-weight:700}

/* Sección */
.cabecera-sec{padding:12px 0 4px}
.cabecera-sec h2{font-size:1.6rem;margin-top:4px}
.consejo{background:var(--papel);border-radius:22px;box-shadow:var(--sombra);padding:20px;margin:14px 0 20px;border-left:6px solid var(--oro)}
.consejo h3{font-size:1.15rem;color:var(--rojo);display:flex;align-items:center;gap:8px}
.consejo ol{margin:12px 0 0;padding-left:22px}
.consejo li{margin:8px 0;line-height:1.45}
.consejo .en{display:block;color:var(--suave);font-size:.86rem;font-style:italic;margin-top:2px}
.pares{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.par{display:inline-flex;align-items:center;gap:6px;background:var(--crema);border:1.5px solid var(--linea);border-radius:99px;padding:8px 14px;font-weight:700}
.par small{color:var(--suave);font-weight:600}
.ver-en{margin-top:12px;font-size:.85rem;font-weight:800;color:var(--rojo);text-decoration:underline}

.controles-sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.controles-sec h3{font-size:1.2rem}
.lento{display:inline-flex;align-items:center;gap:8px;background:var(--papel);border:1.5px solid var(--linea);border-radius:99px;padding:8px 14px;font-weight:700;font-size:.9rem}
.lento[aria-pressed=true]{background:var(--oro-claro);border-color:var(--oro)}

.palabras{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding-bottom:40px}
.palabra{background:var(--papel);border-radius:22px;box-shadow:var(--sombra);padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;border:2px solid transparent;transition:border-color .2s}
.palabra.practicada{border-color:#CDE8D6}
.palabra .emoji{font-size:4.2rem;line-height:1;margin:6px 0 8px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.08))}
.palabra .es{font-family:Fraunces,serif;font-size:1.65rem;font-weight:700;color:var(--tinta);padding:4px 10px;border-radius:12px;border-bottom:2px dashed var(--oro)}
.palabra .es b{color:var(--rojo)}
.palabra .trad{min-height:1.5em;margin-top:6px;font-weight:700;color:var(--suave);font-size:.98rem}
.palabra .trad.vista{color:#1F5E8C}
.chip{font-size:.72rem;font-weight:800;background:var(--crema);border:1px solid var(--linea);border-radius:99px;padding:2px 8px;color:var(--suave);margin-top:6px}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:12px}
.acc{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 8px;border-radius:14px;font-weight:800;font-size:.92rem;background:var(--crema);border:1.5px solid var(--linea)}
.acc:disabled{opacity:.4;cursor:default}
.acc.escuchar{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.acc.grabar.activo{background:#fff0f0;border-color:var(--rojo);color:var(--rojo);animation:pulso 1s infinite}
@keyframes pulso{50%{box-shadow:0 0 0 6px rgba(179,18,28,.12)}}
.acc.comparar{grid-column:1/-1;background:var(--oro-claro);border-color:var(--oro)}
.acc svg{width:18px;height:18px;flex:none}

.aviso{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:.92rem;transition:transform .3s;z-index:20;max-width:90vw;text-align:center}
.aviso.ver{transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:var(--suave);font-size:.8rem;padding:10px 0 28px}
</style>
</head>

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const guardar = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const leer = (k,def) => { try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } };
let alumno = leer("swm_alumno", "");
let practicadas = leer("swm_practicadas", {});   // { "cz:cerveza": true }
let lento = false;
let seccionActual = null;

function aviso(txt){
  const a = $("#aviso"); a.textContent = txt; a.classList.add("ver");
  clearTimeout(aviso._t); aviso._t = setTimeout(()=>a.classList.remove("ver"), 2600);
}

/* ---------- Seguimiento (Google Sheets) ---------- */
let cola = leer("swm_cola", []);
function registrar(accion, seccion="", palabra=""){
  if(!alumno) return;
  cola.push({t:new Date().toISOString(), alumno, seccion, palabra, accion});
  guardar("swm_cola", cola);
  clearTimeout(registrar._t); registrar._t = setTimeout(enviar, 4000);
}
function enviar(){
  if(!URL_SEGUIMIENTO || URL_SEGUIMIENTO.startsWith("__") || !cola.length) return;
  const lote = cola.slice(0, 50);
  fetch(URL_SEGUIMIENTO, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({eventos:lote})})
    .then(()=>{ cola = cola.slice(lote.length); guardar("swm_cola", cola); if(cola.length) enviar(); })
    .catch(()=>{});
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") enviar(); });

/* ---------- Voz del modelo ---------- */
let vozES = null;
function elegirVoz(){
  const voces = speechSynthesis.getVoices();
  const es = voces.filter(v => /^es/i.test(v.lang));
  vozES = es.find(v => /es[-_]ES/i.test(v.lang) && /(Mónica|Monica|Google|Jorge|Lucía|Lucia|Elvira|Alvaro|Álvaro)/i.test(v.name))
       || es.find(v => /es[-_]ES/i.test(v.lang)) || es[0] || null;
}
if("speechSynthesis" in window){ elegirVoz(); speechSynthesis.onvoiceschanged = elegirVoz; }

function decir(texto, alTerminar, despacio){
  if(!("speechSynthesis" in window)){ aviso("Este navegador no tiene voz. Prueba con Chrome o Safari."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = "es-ES"; if(vozES) u.voice = vozES;
  u.rate = despacio ? 0.5 : 0.85;
  if(alTerminar) u.onend = alTerminar;
  speechSynthesis.speak(u);
}

/* ---------- Grabación (no se guarda nada) ---------- */
const grabaciones = {};   // solo en memoria mientras la página está abierta
let grabador = null, flujo = null, grabandoClave = null;

async function alternarGrabacion(clave, boton, tarjeta){
  if(grabador && grabador.state === "recording"){ grabador.stop(); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){ aviso("Tu navegador no permite grabar. Prueba con Chrome o Safari."); return; }
  try{
    flujo = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){ aviso("Necesito permiso para usar el micrófono 🎙️"); return; }
  speechSynthesis.cancel();
  const trozos = [];
  grabador = new MediaRecorder(flujo);
  grabandoClave = clave;
  grabador.ondataavailable = e => { if(e.data.size) trozos.push(e.data); };
  grabador.onstop = () => {
    flujo.getTracks().forEach(t=>t.stop());
    if(grabaciones[clave]) URL.revokeObjectURL(grabaciones[clave]);
    grabaciones[clave] = URL.createObjectURL(new Blob(trozos, {type: grabador.mimeType || "audio/webm"}));
    boton.classList.remove("activo"); boton.innerHTML = ICON.mic + "Grabarme";
    tarjeta.querySelector(".mia").disabled = false;
    tarjeta.querySelector(".comparar").disabled = false;
    grabandoClave = null;
    clearTimeout(alternarGrabacion._t);
    marcarPracticada(clave, tarjeta);
  };
  grabador.start();
  boton.classList.add("activo"); boton.innerHTML = ICON.stop + "Parar";
  alternarGrabacion._t = setTimeout(()=>{ if(grabador.state==="recording") grabador.stop(); }, 6000);
}
function oirMia(clave, alTerminar){
  const src = grabaciones[clave]; if(!src) return;
  const a = new Audio(src); if(alTerminar) a.onended = alTerminar; a.play();
}

function marcarPracticada(clave, tarjeta){
  if(!practicadas[clave]){ practicadas[clave] = true; guardar("swm_practicadas", practicadas); }
  tarjeta.classList.add("practicada");
}

/* ---------- Iconos ---------- */
const ICON = {
  play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  yo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="7 4 19 12 7 20 7 4"/></svg>',
  cmp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3"/><path d="M17 17H6l3 3"/></svg>'
};

/* ---------- Pantallas ---------- */
function mostrarBienvenida(){
  $("#app").classList.add("oculto"); $("#bienvenida").classList.remove("oculto");
  $("#campo-nombre").value = ""; setTimeout(()=>$("#campo-nombre").focus(), 100);
}
function empezar(){
  const n = $("#campo-nombre").value.trim();
  if(!n){ aviso("Escribe tu nombre · Type your name"); return; }
  alumno = n.charAt(0).toUpperCase() + n.slice(1);
  guardar("swm_alumno", alumno);
  practicadas = leer("swm_practicadas_"+alumno, {});
  abrirApp();
}
function abrirApp(){
  $("#bienvenida").classList.add("oculto"); $("#app").classList.remove("oculto");
  $("#txt-nombre").textContent = alumno;
  $("#saludo-txt").textContent = "¡Hola, " + alumno + "!";
  registrar("entrada");
  pintarInicio();
}

function pintarInicio(){
  seccionActual = null;
  $("#vista-seccion").classList.add("oculto"); $("#vista-inicio").classList.remove("oculto");
  const cont = $("#lista-secciones"); cont.innerHTML = "";
  SECCIONES.forEach(s=>{
    const hechas = s.palabras.filter(p => practicadas[s.id+":"+p[0]]).length;
    const b = document.createElement("button");
    b.className = "sec-card";
    b.innerHTML = `<div class="sec-letra">${s.letra}</div>
      <div style="flex:1;min-width:0">
        <h3>${s.titulo}</h3>
        <div class="ej">${s.sub} · ${s.palabras.slice(0,3).map(p=>p[0]).join(", ")}…</div>
        <div class="barra"><i style="width:${hechas*10}%"></i></div>
        <div class="progreso-txt">${hechas} / ${s.palabras.length} practicadas</div>
      </div>`;
    b.onclick = () => abrirSeccion(s);
    cont.appendChild(b);
  });
  window.scrollTo(0,0);
}

function resaltar(palabra, re){ return palabra.replace(re, m => `<b>${m}</b>`); }

function abrirSeccion(s){
  seccionActual = s;
  registrar("abrir sección", s.titulo);
  $("#vista-inicio").classList.add("oculto"); $("#vista-seccion").classList.remove("oculto");
  $("#titulo-sec").textContent = "Sonido " + s.titulo;

  // Consejo de pronunciación
  const c = s.consejo;
  $("#consejo").innerHTML = `<h3>${c.titulo}</h3>
    <ol>${c.pasos.map(p=>`<li>${p[0]}<span class="en oculto">${p[1]}</span></li>`).join("")}</ol>
    <div class="pares">${c.pares.map(p=>`<button class="par" data-p="${p[0]}">🔊 ${p[0]} <small>${p[1]}</small></button>`).join("")}</div>
    <button class="ver-en">Show in English</button>`;
  $("#consejo").querySelectorAll(".par").forEach(b => b.onclick = () => { decir(b.dataset.p); registrar("escuchar ejemplo", s.titulo, b.dataset.p); });
  const ve = $("#consejo .ver-en");
  ve.onclick = () => {
    const ocultos = $("#consejo").querySelectorAll(".en");
    const mostrar = ocultos[0].classList.contains("oculto");
    ocultos.forEach(e => e.classList.toggle("oculto", !mostrar));
    ve.textContent = mostrar ? "Ocultar inglés" : "Show in English";
  };

  // Palabras
  const lista = $("#lista-palabras"); lista.innerHTML = "";
  s.palabras.forEach(([es, emoji, en, tipo])=>{
    const clave = s.id + ":" + es;
    const t = document.createElement("div");
    t.className = "palabra" + (practicadas[clave] ? " practicada" : "");
    t.innerHTML = `<div class="emoji" aria-hidden="true">${emoji}</div>
      <button class="es" title="Toca para ver en inglés">${resaltar(es, s.resaltar)}</button>
      <div class="trad">&nbsp;</div>
      ${tipo ? `<span class="chip">${tipo === "RR" ? "RR fuerte" : "R suave"}</span>` : ""}
      <div class="acciones">
        <button class="acc escuchar">${ICON.play}Escuchar</button>
        <button class="acc grabar">${ICON.mic}Grabarme</button>
        <button class="acc mia" disabled>${ICON.yo}Mi voz</button>
        <button class="acc modelo">🐢 Despacio</button>
        <button class="acc comparar" disabled>${ICON.cmp}Comparar: modelo → mi voz</button>
      </div>`;
    if(grabaciones[clave]){ t.querySelector(".mia").disabled = false; t.querySelector(".comparar").disabled = false; }

    t.querySelector(".es").onclick = () => {
      const tr = t.querySelector(".trad");
      const visible = tr.classList.toggle("vista");
      tr.innerHTML = visible ? "🇬🇧 " + en : "&nbsp;";
      if(visible){ decir(es); registrar("traducción", s.titulo, es); }
    };
    t.querySelector(".escuchar").onclick = () => { decir(es); registrar("escuchar", s.titulo, es); };
    t.querySelector(".modelo").onclick = () => { decir(es, null, true); registrar("escuchar despacio", s.titulo, es); };
    t.querySelector(".grabar").onclick = e => {
      const btn = e.currentTarget;
      if(!(grabador && grabador.state==="recording")) registrar("grabar", s.titulo, es);
      alternarGrabacion(clave, btn, t);
    };
    t.querySelector(".mia").onclick = () => oirMia(clave);
    t.querySelector(".comparar").onclick = () => {
      registrar("comparar", s.titulo, es);
      decir(es, () => setTimeout(()=>oirMia(clave), 350));
    };
    lista.appendChild(t);
  });
  window.scrollTo(0,0);
}

/* ---------- Eventos ---------- */
$("#btn-empezar").onclick = empezar;
$("#campo-nombre").addEventListener("keydown", e => { if(e.key==="Enter") empezar(); });
$("#btn-cambiar").onclick = () => { enviar(); alumno=""; guardar("swm_alumno",""); mostrarBienvenida(); };
$("#btn-volver").onclick = pintarInicio;


// Guardar progreso por alumno (por si varios alumnos usan el mismo dispositivo)
const _guardarOriginal = guardar;
window.addEventListener("beforeunload", ()=>{ if(alumno) _guardarOriginal("swm_practicadas_"+alumno, practicadas); enviar(); });
setInterval(()=>{ if(alumno) _guardarOriginal("swm_practicadas_"+alumno, practicadas); }, 5000);

// Arranque
if(alumno){ practicadas = leer("swm_practicadas_"+alumno, practicadas); abrirApp(); } else mostrarBienvenida();
enviar();
</script>
</body>
</html>
